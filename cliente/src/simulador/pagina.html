<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador del bot de CorteYa</title>
  <style>
    :root { --carbon: #1c1c1e; --dorado: #c8a15a; --crema: #f7f4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--carbon); color: #222; display: flex; justify-content: center; }
    main { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--crema); }
    header { background: var(--carbon); color: #fff; padding: 12px 16px; border-bottom: 3px solid var(--dorado); }
    header strong { color: var(--dorado); letter-spacing: .05em; }
    header small { display: block; opacity: .7; }
    #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.35; word-wrap: break-word; }
    .yo { align-self: flex-end; background: #dcf8c6; }
    .bot { align-self: flex-start; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
    form { display: flex; gap: 8px; padding: 10px; background: #ece7df; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 16px; }
    button { border: 0; background: var(--dorado); color: #fff; font-weight: 600; padding: 0 18px; border-radius: 20px; cursor: pointer; }
    .campos { display: flex; gap: 8px; padding: 8px 10px; background: #ece7df; font-size: 12px; }
    .campos input { padding: 4px 8px; font-size: 12px; border-radius: 6px; width: 100%; }
  </style>
</head>
<body>
<main>
  <header><strong>CORTEYA</strong> · Simulador del bot<small>Prueba la conversación sin WhatsApp (modo de desarrollo)</small></header>
  <div class="campos">
    <label style="flex:1">Teléfono<input id="telefono" value="573001234567"></label>
    <label style="flex:1">Nombre<input id="nombre" value="Daniela Silva"></label>
  </div>
  <div id="chat"></div>
  <form id="formulario">
    <input id="texto" autocomplete="off" placeholder="Escribe un mensaje (hola, 1, 2...)" autofocus>
    <button>Enviar</button>
  </form>
</main>
<script>
  const chat = document.getElementById('chat');
  const texto = document.getElementById('texto');

  function pintar(clase, contenido) {
    const burbuja = document.createElement('div');
    burbuja.className = `msg ${clase}`;
    burbuja.textContent = contenido;
    chat.appendChild(burbuja);
    chat.scrollTop = chat.scrollHeight;
  }

  document.getElementById('formulario').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    const mensaje = texto.value.trim();
    if (!mensaje) return;

    pintar('yo', mensaje);
    texto.value = '';

    try {
      const respuesta = await fetch('/simulador/mensaje', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telefono: document.getElementById('telefono').value,
          nombre: document.getElementById('nombre').value,
          texto: mensaje,
        }),
      });
      const datos = await respuesta.json();
      datos.respuestas.forEach((r) => pintar('bot', r));
    } catch {
      pintar('bot', 'No pude comunicarme con el bot.');
    }
  });
</script>
</body>
</html>
